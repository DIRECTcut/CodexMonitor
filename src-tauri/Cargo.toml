[package]
name = "codex-monitor"
version = "0.7.68"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "codex-monitor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
app = [
    "dep:block2",
    "dep:cpal",
    "dep:fix-path-env",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-av-foundation",
    "dep:objc2-foundation",
    "dep:portable-pty",
    "dep:sha2",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-liquid-glass",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-window-state",
    "dep:whisper-rs",
]
custom-protocol = ["app", "tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codex_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-monitor"
path = "src/main.rs"
required-features = ["app"]

[[bin]]
name = "codex_monitor_daemon"
path = "src/bin/codex_monitor_daemon.rs"

[[bin]]
name = "codex_monitor_daemonctl"
path = "src/bin/codex_monitor_daemonctl.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [], optional = true }

[dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"], optional = true }
tauri-plugin-liquid-glass = { version = "0.1", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "io-util", "process", "rt", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = { version = "2", optional = true }
git2 = { version = "0.20.3", features = ["vendored-openssl", "vendored-libgit2"] }
base64 = "0.22"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", optional = true }
ignore = "0.4.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
shell-words = "1.1"
toml_edit = "0.20.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = { version = "2.10.0", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
cpal = { version = "0.15", optional = true }
whisper-rs = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
portable-pty = { version = "0.8", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSResponder", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3", features = ["NSString"], optional = true }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"], optional = true }
block2 = { version = "0.6", optional = true }

[target."cfg(target_os = \"ios\")".dependencies]
objc2 = { version = "0.6", optional = true }
